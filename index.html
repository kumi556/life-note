<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>个人工具集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#3b82f6'
      }
    }
  }
}
</script>
<style>
  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    overflow: hidden;
    margin: 0;
  }
  .bg-container {
    transition: background 0.3s;
    height: 100%;
    overflow: hidden;
  }
  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 80px;
    height: 100%;
    z-index: 40;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8vh;
    align-items: center;
  }
  .side-icon {
    width: 48px;
    height: 48px;
    border-radius: 0.5rem;
    background: rgba(255,255,255,0.8);
    box-shadow: 0 1px 3px #0002;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .page-container {
    position: absolute;
    top: 0;
    left: 80px;
    width: calc(100% - 80px);
    height: 100%;
    overflow-y: auto;
  }
  .timer-ring {
    transform: rotate(-90deg);
  }
  .dot-marker {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    display: inline-block;
    margin-right: 6px;
  }
  .checkin-group-box {
    background: #eff6ff;
    padding: 12px;
    border-radius: 8px;
    margin: 8px 0;
  }
  .checkin-item-card {
    background: rgba(255,255,255,0.75);
    padding: 10px;
    border-radius: 6px;
    margin: 6px 0 6px 12px;
  }
</style>
</head>
<body>

<div id="app" class="bg-container relative">
  <div class="sidebar">
    <div onclick="renderPage('home')" class="side-icon">
      <i class="fa fa-home text-primary text-xl"></i>
    </div>
    <div onclick="renderPage('book')" class="side-icon">
      <i class="fa fa-book text-primary text-xl"></i>
    </div>
    <div onclick="renderPage('record')" class="side-icon">
      <i class="fa fa-file-text-o text-primary text-xl"></i>
    </div>
    <div onclick="renderPage('todo')" class="side-icon">
      <i class="fa fa-list-ul text-primary text-xl"></i>
    </div>
    <div onclick="renderPage('checkin')" class="side-icon">
      <i class="fa fa-calendar-check-o text-primary text-xl"></i>
    </div>
    <div onclick="renderPage('focus')" class="side-icon">
      <i class="fa fa-clock-o text-primary text-xl"></i>
    </div>
    <div onclick="openModal('modal-backup')" class="side-icon">
      <i class="fa fa-download text-primary text-xl"></i>
    </div>
    <div onclick="openBgSetting()" class="side-icon mt-auto mb-8">
      <i class="fa fa-picture-o text-primary text-xl"></i>
    </div>
  </div>

  <div id="page-container" class="page-container"></div>
</div>

<!-- 背景设置弹窗 -->
<div id="modal-bg" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">背景设置</h3>
    <div class="mb-3">
      <label class="block text-sm mb-1">背景颜色</label>
      <input type="color" id="bg-color" class="w-full h-10" onchange="setBgColor()" />
    </div>
    <div class="mb-3">
      <label class="block text-sm mb-1">自定义背景图片</label>
      <input type="file" accept="image/*" onchange="uploadBgImage()" />
    </div>
    <button onclick="closeModal('modal-bg')" class="w-full py-2 bg-gray-200 rounded">关闭</button>
  </div>
</div>

<!-- 新增账单弹窗 -->
<div id="modal-bill" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新增账目</h3>
    <div class="space-y-2">
      <div class="flex items-center gap-2">
        <label>日期</label>
        <input type="date" id="bill-date" class="flex-1 border p-2 rounded" />
      </div>
      <select id="bill-type" class="w-full border p-2 rounded">
        <option value="income">收入</option>
        <option value="expense">支出</option>
      </select>
      <select id="bill-category" class="w-full border p-2 rounded"></select>
      <input type="number" id="bill-amount" placeholder="金额" class="w-full border p-2 rounded" />
      <input type="text" id="bill-note" placeholder="备注" class="w-full border p-2 rounded" />
    </div>
    <div class="mt-2">
      <button onclick="openSelectFixedModal()" class="w-full py-1 bg-gray-300 rounded text-sm">选择定额卡片，快速记账</button>
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="saveBill()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-bill')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 选择定额卡片弹窗 -->
<div id="modal-select-fixed" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm max-h-[70vh] overflow-y-auto">
    <h3 class="font-bold mb-3">选择定额卡片一键记账</h3>
    <div id="select-fixed-list" class="space-y-2"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="closeModal('modal-select-fixed')" class="flex-1 py-2 bg-gray-200 rounded">关闭</button>
    </div>
  </div>
</div>

<!-- 编辑账单弹窗 -->
<div id="modal-bill-edit" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">编辑账目</h3>
    <input type="hidden" id="edit-bill-index" />
    <div class="space-y-2">
      <input type="date" id="edit-bill-date" class="w-full border p-2 rounded" />
      <select id="edit-bill-type" class="w-full border p-2 rounded">
        <option value="income">收入</option>
        <option value="expense">支出</option>
      </select>
      <select id="edit-bill-category" class="w-full border p-2 rounded"></select>
      <input type="number" id="edit-bill-amount" placeholder="金额" class="w-full border p-2 rounded" />
      <input type="text" id="edit-bill-note" placeholder="备注" class="w-full border p-2 rounded" />
    </div>
    <div class="flex gap-2 mt-4">
      <button onclick="updateBill()" class="flex-1 py-2 bg-primary text-white rounded">保存修改</button>
      <button onclick="deleteEditBill()" class="flex-1 py-2 bg-red-500 text-white rounded">删除本条</button>
      <button onclick="closeModal('modal-bill-edit')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 新增分类弹窗 -->
<div id="modal-category" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新增分类</h3>
    <input type="text" id="category-name" placeholder="分类名称" class="w-full border p-2 rounded" />
    <div class="flex gap-2 mt-4">
      <button onclick="saveCategory()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-category')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 编辑分类弹窗 -->
<div id="modal-category-edit" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">编辑分类名称</h3>
    <input type="hidden" id="edit_cat_idx" />
    <input type="text" id="edit_cat_name" placeholder="新分类名称" class="w-full border p-2 rounded mb-3" />
    <div class="flex gap-2">
      <button onclick="updateCategory()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-category-edit')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 新增定额弹窗 -->
<div id="modal-fixedbill" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新增定额</h3>
    <select id="fixed-type" class="w-full border p-2 rounded mb-2">
      <option value="month">每月定额</option>
      <option value="day">每日定额</option>
    </select>
    <input type="text" id="fixed-name" placeholder="名称（房租/话费）" class="w-full border p-2 rounded mb-2" />
    <select id="fixed-cat" class="w-full border p-2 rounded mb-2"></select>
    <input type="number" id="fixed-amount" placeholder="金额" class="w-full border p-2 rounded mb-2" />
    <input type="text" id="fixed-note" placeholder="备注" class="w-full border p-2 rounded mb-2" />
    <div class="flex gap-2 mt-4">
      <button onclick="saveFixedBill()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-fixedbill')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 编辑定额弹窗 -->
<div id="modal-fixed-edit" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">编辑定额</h3>
    <input type="hidden" id="edit-fixed-idx" />
    <select id="edit-fixed-type" class="w-full border p-2 rounded mb-2">
      <option value="month">每月定额</option>
      <option value="day">每日定额</option>
    </select>
    <input type="text" id="edit-fixed-name" placeholder="名称" class="w-full border p-2 rounded mb-2" />
    <select id="edit-fixed-cat" class="w-full border p-2 rounded mb-2"></select>
    <input type="number" id="edit-fixed-amount" placeholder="金额" class="w-full border p-2 rounded mb-2" />
    <input type="text" id="edit-fixed-note" placeholder="备注" class="w-full border p-2 rounded mb-2" />
    <div class="flex gap-2 mt-4">
      <button onclick="updateFixedBill()" class="flex-1 py-2 bg-primary text-white rounded">保存修改</button>
      <button onclick="deleteFixedBillByIdx()" class="flex-1 py-2 bg-red-500 text-white rounded">删除</button>
      <button onclick="closeModal('modal-fixed-edit')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 记事本弹窗 -->
<div id="modal-note" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新建笔记</h3>
    <input type="text" id="note-title" placeholder="标题" class="w-full border p-2 rounded mb-2" />
    <textarea id="note-content" rows="5" placeholder="内容" class="w-full border p-2 rounded"></textarea>
    <div class="flex gap-2 mt-4">
      <button onclick="saveNote()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-note')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 项目弹窗 -->
<div id="modal-project" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm max-h-[80vh] overflow-y-auto">
    <h3 class="font-bold mb-3">新建项目</h3>
    <input type="text" id="project-name" placeholder="项目名称" class="w-full border p-2 rounded mb-2" />
    <div id="step-list" class="space-y-2 mb-3"></div>
    <button onclick="addStep()" class="text-primary mb-2"><i class="fa fa-plus"></i> 添加步骤</button>
    <div class="flex gap-2">
      <button onclick="saveProject()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-project')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 待办弹窗 -->
<div id="modal-todo" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新增待办</h3>
    <input type="text" id="todo-text" placeholder="待办内容" class="w-full border p-2 rounded mb-2" />
    <input type="datetime-local" id="todo-time" class="w-full border p-2 rounded" />
    <div class="flex gap-2 mt-4">
      <button onclick="saveTodo()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-todo')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 打卡-新建分类弹窗 -->
<div id="modal-checkin-cat-add" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新建打卡分类</h3>
    <input type="text" id="chk_cat_name" placeholder="分类名称" class="w-full border p-2 rounded mb-3" />
    <div class="flex gap-2">
      <button onclick="saveCheckinCat()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-checkin-cat-add')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 打卡-编辑分类弹窗 -->
<div id="modal-checkin-cat-edit" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">编辑打卡分类</h3>
    <input type="hidden" id="edit_chk_cat_id" />
    <input type="text" id="edit_chk_cat_name" placeholder="分类名称" class="w-full border p-2 rounded mb-3" />
    <div class="flex gap-2">
      <button onclick="updateCheckinCat()" class="flex-1 py-2 bg-primary text-white rounded">保存修改</button>
      <button onclick="closeModal('modal-checkin-cat-edit')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 打卡-新建打卡项目弹窗 -->
<div id="modal-checkin-add" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">新建打卡项目</h3>
    <select id="chk_item_cat_sel" class="w-full border p-2 rounded mb-2"></select>
    <input type="text" id="chk_item_name" placeholder="打卡名称" class="w-full border p-2 rounded mb-2" />
    <input type="text" id="chk_item_note" placeholder="备注" class="w-full border p-2 rounded mb-3" />
    <div class="flex gap-2">
      <button onclick="saveCheckinItem()" class="flex-1 py-2 bg-primary text-white rounded">保存</button>
      <button onclick="closeModal('modal-checkin-add')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
    </div>
  </div>
</div>

<!-- 打卡-编辑打卡项弹窗 -->
<div id="modal-checkin-item-edit" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-4 w-full max-w-sm">
        <h3 class="font-bold mb-3">编辑打卡项目</h3>
        <input type="hidden" id="edit_chk_item_idx" />
        <select id="edit_chk_item_cat" class="w-full border p-2 rounded mb-2"></select>
        <input type="text" id="edit_chk_item_name" placeholder="打卡名称" class="w-full border p-2 rounded mb-2" />
        <input type="text" id="edit_chk_item_note" placeholder="备注" class="w-full border p-2 rounded mb-2" />
        <div class="flex gap-2">
            <button onclick="updateCheckinItem()" class="flex-1 py-2 bg-primary text-white rounded">保存修改</button>
            <button onclick="closeModal('modal-checkin-item-edit')" class="flex-1 py-2 bg-gray-200 rounded">取消</button>
        </div>
    </div>
</div>

<!-- 打卡日历弹窗 -->
<div id="modal-checkin-calendar" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <div class="flex justify-between items-center mb-3">
      <h3 id="checkin-calendar-title" class="font-bold truncate"></h3>
      <button onclick="closeModal('modal-checkin-calendar')" aria-label="关闭日历" class="ml-3 text-gray-500"><i class="fa fa-times"></i></button>
    </div>
    <div class="flex items-center justify-between mb-3">
      <button onclick="shiftCheckinCalendarMonth(-1)" aria-label="上个月" class="w-9 h-9 rounded hover:bg-gray-100"><i class="fa fa-chevron-left"></i></button>
      <input type="month" id="checkin-calendar-month" onchange="renderCheckinCalendar()" class="border p-2 rounded" />
      <button onclick="shiftCheckinCalendarMonth(1)" aria-label="下个月" class="w-9 h-9 rounded hover:bg-gray-100"><i class="fa fa-chevron-right"></i></button>
    </div>
    <div id="checkin-calendar-grid" class="grid grid-cols-7 gap-1 text-center"></div>
    <div class="flex items-center justify-center gap-4 mt-3 text-xs text-gray-600">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-orange-500"></span>已打卡</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm border border-gray-200 bg-white"></span>未打卡</span>
    </div>
  </div>
</div>

<!-- 数据备份弹窗 -->
<div id="modal-backup" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
  <div class="bg-white rounded-lg p-4 w-full max-w-sm">
    <h3 class="font-bold mb-3">数据备份 / 导入</h3>
    <div class="space-y-3">
      <button onclick="exportAllData()" class="w-full py-2 bg-primary text-white rounded">导出全部数据备份(json)</button>
      <div>
        <label class="block text-sm mb-1">从备份文件导入(合并现有数据)</label>
        <input type="file" accept=".json" id="import-file" class="w-full" />
        <button onclick="importAllData()" class="w-full mt-2 py-2 bg-orange-500 text-white rounded">执行导入</button>
      </div>
    </div>
    <button onclick="closeModal('modal-backup')" class="w-full mt-3 py-2 bg-gray-200 rounded">关闭</button>
  </div>
</div>

<script>
let currentPage = "home";
const STORAGE_KEYS = {
  bills: "tool_bills",
  categories: "tool_categories",
  notes: "tool_notes",
  projects: "tool_projects",
  todos: "tool_todos",
  checkins: "tool_checkins",
  bg: "tool_bg",
  fixedBills: "tool_fixedBills",
  checkinItemCats: "tool_checkinItemCats",
  checkinItems: "tool_checkinItems"
};

let data = {
  bills: JSON.parse(localStorage.getItem(STORAGE_KEYS.bills)) || [],
  categories: JSON.parse(localStorage.getItem(STORAGE_KEYS.categories)) || ["餐饮", "交通", "购物", "工资"],
  notes: JSON.parse(localStorage.getItem(STORAGE_KEYS.notes)) || [],
  projects: JSON.parse(localStorage.getItem(STORAGE_KEYS.projects)) || [],
  todos: JSON.parse(localStorage.getItem(STORAGE_KEYS.todos)) || [],
  checkinItemCats: JSON.parse(localStorage.getItem(STORAGE_KEYS.checkinItemCats)) || [
    { catId: "def", catName: "默认分类" }
  ],
  checkinItems: JSON.parse(localStorage.getItem(STORAGE_KEYS.checkinItems)) || []
};

let fixedBills = JSON.parse(localStorage.getItem(STORAGE_KEYS.fixedBills)) || [];
let timerInfo = { total: 0, remain: 0, timerId: null, running: false };
let stepTempList = [];
let billFilter = { singleDate: "" };
let pieChart = null;
let lineChart = null;

function openModal(id) {
  document.getElementById(id).classList.remove("hidden");
}

function closeModal(id) {
  document.getElementById(id).classList.add("hidden");
}

function renderPage(pageName) {
  if (timerInfo.running) pauseTimer();
  currentPage = pageName;
  const container = document.getElementById("page-container");
  container.innerHTML = "";
  switch (pageName) {
    case "home": renderHomePage(container); break;
    case "book": renderBookPage(container); break;
    case "record": renderRecordPage(container); break;
    case "todo": renderTodoPage(container); break;
    case "checkin": renderCheckinPage(container); break;
    case "focus": renderFocusPage(container); break;
  }
}

function renderHomePage(box) {
  box.innerHTML = `
    <div class="h-full flex items-center justify-center text-gray-500 text-lg">
      <div>点击左侧图标进入功能</div>
    </div>`;
}

function renderBookPage(box) {
  const todayStr = new Date().toISOString().split("T")[0];
  box.innerHTML = `
    <div class="p-4">
      <div class="flex justify-between items-center mb-4">
        <button onclick="renderPage('home')"><i class="fa fa-arrow-left text-xl"></i></button>
        <h2 class="text-xl font-bold">记账本</h2>
        <div class="flex gap-2">
          <button onclick="openModal('modal-category')" class="px-2 py-1 bg-gray-300 rounded text-sm">新建分类</button>
          <button onclick="openAddBillModal()"><i class="fa fa-plus-circle text-xl text-primary"></i></button>
        </div>
      </div>

      <div class="mb-4 p-3 bg-white/70 rounded-lg">
        <div class="font-semibold mb-2">查看每日花销</div>
        <div class="flex gap-2 mb-2 flex-wrap">

function getExpenseDotClass(amount) {
  if (amount > 1000) return "bg-black";
  if (amount > 500) return "bg-red-500";
  if (amount > 100) return "bg-orange-500";
  if (amount > 50) return "bg-purple-500";
  if (amount > 20) return "bg-yellow-500";
  return "bg-green-500";
}

function getAmountColor(amount) {
  if (amount > 1000) return "text-black";
  if (amount > 500) return "text-red-600";
  if (amount > 100) return "text-orange-500";
  if (amount > 50) return "text-purple-600";
  if (amount > 20) return "text-yellow-600";
  return "text-green-600";
}

function renderBillList() {
  const wrap = document.getElementById("bill-list");
  if (!wrap) return;
  wrap.innerHTML = "";
  let list = [...data.bills];

  if (billFilter.singleDate) {
    const targetDate = new Date(billFilter.singleDate);
    const targetY = targetDate.getFullYear();
    const targetM = targetDate.getMonth();
    const targetD = targetDate.getDate();
    list = list.filter(b => {
      const bd = new Date(b.date);
      return bd.getFullYear() === targetY && bd.getMonth() === targetM && bd.getDate() === targetD;
    });
  }

  list.sort((a, b) => new Date(b.date) - new Date(a.date));

  list.forEach((b) => {
    let amountText;
    let dotHtml = "";

    if (b.type === "income") {
      amountText = `<span class="text-green-600">+${b.amount}</span>`;
    } else {
      amountText = `<span class="${getAmountColor(b.amount)}">-${b.amount}</span>`;
      dotHtml = `<span class="dot-marker ${getExpenseDotClass(b.amount)}"></span>`;
    }

    wrap.innerHTML += `
      <div class="bg-white/85 p-3 rounded-lg shadow-sm cursor-pointer" onclick="openEditBillModal(${data.bills.indexOf(b)})">
        <div class="flex justify-between items-center">
          <div>${dotHtml}${b.date}｜${b.category}｜${b.note || "无备注"}</div>
          <div class="font-bold">${amountText}</div>
        </div>
      </div>`;
  });
}

function filterBillBySingleDate() {
  const d = document.getElementById("filter-single-date").value;
  if (!d) {
    document.getElementById("filter-tip").innerText = "请选择日期！";
    return;
  }
  billFilter.singleDate = d;
  document.getElementById("filter-tip").innerText = `正在查看：${d} 的花销`;
  renderBillList();
  const dayWrap = document.getElementById("day-bill-wrap");
  const targetDate = new Date(d);
  const y = targetDate.getFullYear();
  const m = targetDate.getMonth();
  const day = targetDate.getDate();
  const dayBills = data.bills.filter(b => {
    const bd = new Date(b.date);
    return bd.getFullYear() === y && bd.getMonth() === m && bd.getDate() === day;
  });
  if (dayBills.length === 0) {
    dayWrap.innerHTML = `<div class="text-gray-500">该日暂无账目记录</div>`;
    return;
  }
  let dayHtml = `<div class="space-y-1">`;
  let dayTotalIncome = 0;
  let dayTotalExp = 0;
  dayBills.forEach(b => {
    if (b.type === "income") {
      dayTotalIncome += b.amount;
    } else {
      dayTotalExp += b.amount;
    }
    if(b.type === "income"){
      //收入绿色
      dayHtml += `<div>${b.category} ${b.note||""} <span class="text-green-600">+${b.amount}</span></div>`;
    }else{
      //支出调用getAmountColor拿到类名放到class属性
      const cls = getAmountColor(b.amount);
      dayHtml += `<div>${b.category} ${b.note||""} <span class="${cls}">-${b.amount}</span></div>`;
    }
  });
  dayHtml += `<div class="mt-2 font-semibold">当日：收入${dayTotalIncome}｜支出${dayTotalExp}｜结余${dayTotalIncome - dayTotalExp}</div></div>`;
  dayWrap.innerHTML = dayHtml;
}

function renderBillStat() {
  let income = 0;
  let expense = 0;
  data.bills.forEach(b => {
    if (b.type === "income") {
      income += b.amount;
    } else {
      expense += b.amount;
    }
  });
  const el = document.getElementById("bill-stat");
  if (el) {
    el.innerHTML = `总收入：${income}｜总支出：<span class="${getAmountColor(expense)}">${expense}</span>｜结余：${income - expense}`;
  }
}

function queryMonthCategoryCost() {
  const month = document.getElementById("stat-month-cat").value;
  const cat = document.getElementById("stat-select-cat").value;
  const resBox = document.getElementById("month-cat-result");

  if (!month || !cat) {
    resBox.innerHTML = `<div class="text-red-500">请选择月份和分类</div>`;
    return;
  }

  const list = data.bills.filter(b => b.type === "expense" && b.category === cat && b.date.startsWith(month));
  let total = 0;
  let dayMap = {};

  list.forEach(b => {
    total += b.amount;
    if (!dayMap[b.date]) dayMap[b.date] = 0;
    dayMap[b.date] += b.amount;
  });

  let html = `<div class="font-semibold">${month}｜${cat}｜总支出：<span class="${getAmountColor(total)}">${total}</span></div>`;
  Object.keys(dayMap).sort().forEach(d => {
    html += `<div class="flex justify-between"><span>${d}</span><span class="${getAmountColor(dayMap[d])}">${dayMap[d]}</span></div>`;
  });

  if (list.length === 0) {
    html += `<div class="text-gray-400 mt-1">该月该分类暂无消费记录</div>`;
  }

  resBox.innerHTML = html;
}

function renderAllChart() {
  if (pieChart) { pieChart.destroy(); pieChart = null; }
  if (lineChart) { lineChart.destroy(); lineChart = null; }

  const pieMonth = document.getElementById("chart-month-pie").value;
  if (pieMonth) {
    const monthBills = data.bills.filter(b => b.type === "expense" && b.date.startsWith(pieMonth));
    const catSum = {};
    monthBills.forEach(b => {
      if (!catSum[b.category]) catSum[b.category] = 0;
      catSum[b.category] += b.amount;
    });

    const pieCtx = document.getElementById("chart-pie").getContext("2d");
    pieChart = new Chart(pieCtx, {
      type: "pie",
      data: {
        labels: Object.keys(catSum),
        datasets: [{ data: Object.values(catSum) }]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }

  const lineCatSel = document.getElementById("chart-line-cat");
  lineCatSel.innerHTML = "";
  data.categories.forEach(c => {
    lineCatSel.innerHTML += `<option value="${c}">${c}</option>`;
  });

  const selCat = lineCatSel.value;
  const baseMonthStr = document.getElementById("chart-line-base-month").value;

  if (!baseMonthStr || !selCat) return;

  const [y, m] = baseMonthStr.split("-").map(Number);
  const base = new Date(y, m - 1, 1);
  const monthList = [];

  for (let off = -3; off <= 3; off++) {
    const d = new Date(base);
    d.setMonth(base.getMonth() + off);
    const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    monthList.push(ym);
  }

  const values = monthList.map(ym => {
    return data.bills
      .filter(b => b.type === "expense" && b.category === selCat && b.date.startsWith(ym))
      .reduce((s, it) => s + it.amount, 0);
  });

  const lineCtx = document.getElementById("chart-line").getContext("2d");
  lineChart = new Chart(lineCtx, {
    type: "line",
    data: {
      labels: monthList,
      datasets: [{ label: selCat + "消费", data: values, fill: false }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function getLocalDateStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function openCheckinCalendar(itemId) {
  const item = data.checkinItems.find(x => x.itemId === itemId);
  if (!item) return;
  activeCheckinCalendarItemId = itemId;
  document.getElementById("checkin-calendar-month").value = getLocalDateStr().slice(0, 7);
  document.getElementById("checkin-calendar-title").textContent = `${item.name} 打卡日历`;
  renderCheckinCalendar();
  openModal("modal-checkin-calendar");
}

function shiftCheckinCalendarMonth(offset) {
  const monthInput = document.getElementById("checkin-calendar-month");
  const [year, month] = monthInput.value.split("-").map(Number);
  const shifted = new Date(year, month - 1 + offset, 1);
  monthInput.value = `${shifted.getFullYear()}-${String(shifted.getMonth() + 1).padStart(2, "0")}`;
  renderCheckinCalendar();
}

function renderCheckinCalendar() {
  const item = data.checkinItems.find(x => x.itemId === activeCheckinCalendarItemId);
  const monthInput = document.getElementById("checkin-calendar-month");
  const grid = document.getElementById("checkin-calendar-grid");
  if (!item || !monthInput.value) return;

  const [year, month] = monthInput.value.split("-").map(Number);
  const firstDayOffset = (new Date(year, month - 1, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month, 0).getDate();
  const records = new Set(Array.isArray(item.records) ? item.records : []);
  const weekdays = ["一", "二", "三", "四", "五", "六", "日"];
  let html = weekdays.map(day => `<div class="py-1 text-xs text-gray-500">${day}</div>`).join("");

  for (let i = 0; i < firstDayOffset; i++) html += `<div aria-hidden="true"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const date = `${monthInput.value}-${String(day).padStart(2, "0")}`;
    const checked = records.has(date);
    html += `<div aria-label="${date}${checked ? " 已打卡" : " 未打卡"}" class="h-9 flex items-center justify-center rounded ${checked ? "bg-orange-500 text-white" : "bg-white text-gray-800 border border-gray-100"}">${day}</div>`;
  }
  grid.innerHTML = html;
}

function doCheckToday(itemId) {
  const today = getLocalDateStr();
  const item = data.checkinItems.find(x => x.itemId === itemId);
  if (!item) return;
  if (item.records.includes(today)) return alert("今日已经打卡！");
  item.records.push(today);
  saveData("checkinItems");
  renderCheckinAll();
}

function calcStreak(recordArr) {
  if (!recordArr || recordArr.length === 0) return 0;
  const unique = [...new Set((recordArr || []).filter(Boolean))].sort().reverse();
  const today = getLocalDateStr();
  const yesterday = getLocalDateStr(new Date(Date.now() - 86400000));
  let streak = 0;
  const canCountFromToday = unique.includes(today);
  const canCountFromYesterday = unique.includes(yesterday);
  for (let i = 0; i < unique.length; i++) {
    const d = Date.parse(unique[i] + "T00:00:00");
    const cur = Date.parse((canCountFromToday ? today : yesterday) + "T00:00:00");
    const deltaDay = Math.round((cur - d) / (1000 * 3600 * 24));
    if (deltaDay === i || deltaDay === i - 1) streak++;
    else break;
  }
  return streak;
}

        const visibleItems = checkinDateFilter ? itemsInCat.filter(it=>it.records.includes(checkinDateFilter)) : itemsInCat;
        matchedItems += visibleItems.length;
        html += `<div class="checkin-group-box">
            <div class="flex justify-between items-center font-bold mb-2">

                </div>
            </div>`;
        if(visibleItems.length ===0){
            html += `<div class="text-sm text-gray-500 ml-3">${checkinDateFilter ? "该分类当日无打卡记录" : "该分类暂无打卡项目"}</div>`;
        }else{
            visibleItems.forEach(item=>{
                const streak = calcStreak(item.records);
                const recordText = checkinDateFilter ? (item.records.includes(checkinDateFilter) ? checkinDateFilter : "无") : (item.records.length>0 ? item.records.join("、"):"暂无打卡记录");
                html += `
                <div class="checkin-item-card">
                    <div class="flex justify-between">
                        <div class="font-semibold">${item.name}</div>
                        <span>连续：${streak}天</span>
                    </div>
                    <div class="text-sm text-gray-600">备注：${item.note||"无"}</div>
                    <div class="text-sm text-gray-500 mt-1">打卡日期：${recordText}</div>
                    <div class="flex gap-2 mt-2 flex-wrap">
                      <button onclick="openCheckinCalendar('${item.itemId}')" aria-label="查看${item.name}打卡日历" title="查看打卡日历" class="px-2 py-1 bg-white border border-gray-200 text-gray-700 rounded text-sm"><i class="fa fa-calendar"></i></button>
                        <button onclick="doCheckToday('${item.itemId}')" class="px-2 py-1 bg-primary text-white rounded text-sm">今日打卡</button>
                        <button onclick="openEditCheckinItemModal('${item.itemId}')" class="px-2 py-1 bg-blue-500 text-white rounded text-sm">编辑</button>
                        <button onclick="deleteCheckinItem('${item.itemId}')" class="px-2 py-1 bg-red-400 text-white rounded text-sm">删除</button>
                    </div>
                </div>`;
            })
        }
        html += `</div>`;
    });
    if (tip) {
      if (!checkinDateFilter) tip.textContent = "";
      else tip.textContent = `查询结果：${matchedItems} 个打卡项目在 ${checkinDateFilter} 有记录（共 ${totalItems} 个项目）`;
    }
    wrap.innerHTML = html;
}

      </div>

function startTimer() {
  if (timerInfo.running) return;
  const h = Number(document.getElementById("focus-h").value || 0);
  const m = Number(document.getElementById("focus-m").value || 0);
  const s = Number(document.getElementById("focus-s").value || 0);
  timerInfo.total = h * 3600 + m * 60 + s;
  if (timerInfo.total <= 0) return alert("设置时间");
  timerInfo.remain = timerInfo.remain || timerInfo.total;
  timerInfo.running = true;
  timerInfo.timerId = setInterval(tickTimer, 1000);
}

function tickTimer() {
  timerInfo.remain--;
  updateTimerUI();
  if (timerInfo.remain <= 0) {
    pauseTimer();
    alert("专注时间结束！");
  }
}

function pauseTimer() {
  timerInfo.running = false;
  clearInterval(timerInfo.timerId);
}

function resetTimer() {
  pauseTimer();
  timerInfo.remain = 0;
  timerInfo.total = 0;
  updateTimerUI();
}

function updateTimerUI() {
  const rem = timerInfo.remain;
  const h = Math.floor(rem / 3600);
  const m = Math.floor((rem % 3600) / 60);
  const s = rem % 60;
  const el = document.getElementById("timer-text");
  if (el) {
    el.innerText = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
  }
  const progressEl = document.getElementById("timer-progress");
  if (progressEl) {
    const percent = timerInfo.total ? rem / timerInfo.total : 0;
    progressEl.style.strokeDashoffset = 283 * (1 - percent);
  }
}

  a.download = `个人工具集备份_${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function importAllData() {
  const fileInput = document.getElementById("import-file");
  const file = fileInput.files[0];
  if (!file) return alert("请选择备份json文件");
  const reader = new FileReader();
  reader.onload = function (e) {
    try {
      const importData = JSON.parse(e.target.result);
      if (importData.data) {
        if (importData.data.bills) data.bills = [...data.bills, ...importData.data.bills];
        if (importData.data.categories) data.categories = [...new Set([...data.categories, ...importData.data.categories])];
        if (importData.data.notes) data.notes = [...data.notes, ...importData.data.notes];
        if (importData.data.projects) data.projects = [...data.projects, ...importData.data.projects];
        if (importData.data.todos) data.todos = [...data.todos, ...importData.data.todos];
        if (importData.data.checkinItemCats) data.checkinItemCats = [...data.checkinItemCats, ...importData.data.checkinItemCats];
        if (importData.data.checkinItems) data.checkinItems = [...data.checkinItems, ...importData.data.checkinItems];
      }
      if (importData.fixedBills) fixedBills = [...fixedBills, ...importData.fixedBills];

      saveData("bills");
      saveData("categories");
      saveData("notes");
      saveData("projects");
      saveData("todos");
      saveData("checkinItemCats");
      saveData("checkinItems");
      localStorage.setItem(STORAGE_KEYS.fixedBills, JSON.stringify(fixedBills));

      alert("导入完成！");
      renderPage(currentPage);
      closeModal("modal-backup");
    } catch (err) {
      alert("导入失败，文件格式错误！" + err.message);
    }
  };
  reader.readAsText(file);
}

function loadBg() {
  const saved = localStorage.getItem(STORAGE_KEYS.bg);
  if (!saved) return;
  const bg = JSON.parse(saved);
  if (bg.type === "color") {
    document.querySelector(".bg-container").style.background = bg.val;
  } else {
    document.querySelector(".bg-container").style.backgroundImage = `url(${bg.val})`;
    document.querySelector(".bg-container").style.backgroundSize = "cover";
    document.querySelector(".bg-container").style.backgroundPosition = "center";
  }
}
