<body>

    <!--新增账单弹窗-->

                    <option value="income">收入</option>

    <!--打卡弹窗-->

        <div class="bg-white rounded-lg p-4 w-full max-w-sm">
            <h3 class="font-bold mb-3">新增打卡项目</h3>
            <input type="text" id="checkin-name" placeholder="打卡名称" class="w-full border p-2 rounded">

    <!--查询打卡弹窗（支持删除某天打卡记录）【修改】-->
    <div id="modal-checkin-query" class="fixed inset-0 bg-black/50 hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white rounded-lg p-4 w-full max-w-sm">
            <h3 class="font-bold mb-3">查询某日打卡</h3>
            <input type="date" id="query-checkin-date" class="w-full border p-2 rounded mb-3">
            <div id="query-checkin-result" class="mb-3 text-sm max-h-48 overflow-y-auto"></div>
            <div class="flex gap-2">

<script>
let currentPage = "home";
const STORAGE_KEYS = {
    bills: "tool_bills",
    categories: "tool_categories",
    notes: "tool_notes",
    projects: "tool_projects",
    todos: "tool_todos",
    checkins: "tool_checkins",
    bg: "tool_bg",
    fixedBills: "tool_fixedBills"
};
let data = {
    bills: JSON.parse(localStorage.getItem(STORAGE_KEYS.bills)) || [],
    categories: JSON.parse(localStorage.getItem(STORAGE_KEYS.categories)) || ["餐饮","交通","购物","工资"],
    notes: JSON.parse(localStorage.getItem(STORAGE_KEYS.notes)) || [],
    projects: JSON.parse(localStorage.getItem(STORAGE_KEYS.projects)) || [],
    todos: JSON.parse(localStorage.getItem(STORAGE_KEYS.todos)) || [],
    checkins: JSON.parse(localStorage.getItem(STORAGE_KEYS.checkins)) || [],
};
let fixedBills = JSON.parse(localStorage.getItem(STORAGE_KEYS.fixedBills)) || [];
let timerInfo = { total:0, remain:0, timerId:null, running:false }
let stepTempList = [];
let billFilter = { singleDate: "" };
let pieChart = null;
let lineChart = null;

function renderPage(pageName) {
    if(timerInfo.running){ pauseTimer(); }
    currentPage = pageName;
    const container = document.getElementById("page-container");
    container.innerHTML = "";
    switch(pageName){
        case "home": renderHomePage(container); break;
        case "book": renderBookPage(container); break;
        case "record": renderRecordPage(container); break;
        case "todo": renderTodoPage(container); break;
        case "checkin": renderCheckinPage(container); break;
        case "focus": renderFocusPage(container); break;
    }
}

function renderHomePage(box){
    box.innerHTML = `<div class="h-full flex items-center justify-center text-gray-500 text-lg"><div>点击左侧图标进入功能</div></div>`;
}

function renderBookPage(box){
    box.innerHTML = `
        <div class="p-4">
            <div class="flex justify-between items-center mb-4">
                <button onclick="renderPage('home')"><i class="fa fa-arrow-left text-xl"></i></button>
                <h2 class="text-xl font-bold">记账本</h2>
                <button onclick="openAddBillModal()"><i class="fa fa-plus-circle text-xl text-primary"></i></button>
            </div>
            <div class="mb-4">
                <div class="flex justify-between mb-2">
                    <span class="font-semibold">分类列表（长按分类开启删除）</span>
                    <button onclick="openAddCategoryModal()" class="text-primary text-sm">新增分类</button>
                </div>
                <div id="category-list" class="flex flex-wrap gap-2"></div>
            </div>

            <!--【新增】按月查询某分类开销模块 -->
            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="font-semibold mb-2">按月查询分类开销</div>
                <div class="flex gap-2 mb-2 flex-wrap">
                    <input type="month" id="stat-month-cat" class="flex-1 border p-2 rounded">
                    <select id="stat-select-cat" class="flex-1 border p-2 rounded"></select>
                </div>
                <button onclick="queryMonthCategoryCost()" class="w-full py-2 bg-primary text-white rounded mb-2">查询</button>
                <div id="month-cat-result" class="text-sm"></div>
            </div>

            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="font-semibold mb-2">按分类查看开销</div>
                <select id="select-category-stat" onchange="renderCategoryStat()" class="w-full border p-2 rounded mb-2">
                    <option value="">请选择分类</option>
                </select>
                <div id="category-stat-info"></div>
            </div>

            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="font-semibold mb-2">选择日期查看当日花销</div>
                <div class="mb-2">
                    <input type="date" id="filter-single-date" class="w-full border p-2 rounded">
                </div>
                <div class="flex gap-2">
                    <button onclick="filterBillBySingleDate()" class="flex-1 py-2 bg-primary text-white rounded">查看当日</button>
                    <button onclick="clearBillFilter()" class="flex-1 py-2 bg-gray-300 rounded">取消筛选</button>
                </div>
                <div id="filter-tip" class="mt-2 text-sm text-gray-600"></div>
            </div>

            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="font-semibold mb-2">图表统计</div>
                <div class="flex gap-2 mb-2 flex-wrap">
                    <select id="chart-type-select" class="flex-1 border p-2 rounded">
                        <option value="pie">饼图：当月各分类消费对比</option>
                        <option value="line">折线图：单分类月度趋势</option>
                    </select>
                    <input type="month" id="chart-month-pie" class="border p-2 rounded">
                    <select id="chart-category-line" class="border p-2 rounded hidden"></select>
                </div>
                <div style="height:260px">
                    <canvas id="chart-canvas"></canvas>
                </div>
            </div>

            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="flex justify-between items-center mb-2">
                    <div class="font-semibold">每月定额消费(房租/话费)</div>
                    <button onclick="openFixedBillModal()" class="text-primary text-sm">新增定额</button>
                </div>
                <div id="fixed-bill-list" class="space-y-2"></div>
            </div>

            <div class="mb-4 p-3 bg-white/70 rounded-lg">
                <div class="font-semibold mb-2">收支统计</div>
                <div id="bill-stat"></div>
            </div>

            <div class="font-semibold mb-2">账目记录
                <div class="text-xs text-gray-400">颜色圆点：>1000黑｜>500红｜>100橙｜>50紫｜>20黄｜≤20绿；点击条目可编辑</div>
            </div>
            <div id="bill-list" class="space-y-2"></div>
        </div>
    `;
    document.getElementById('chart-type-select').onchange = renderChartArea;
    renderCategoryList();
    renderCategorySelectOptions();
    //填充【按月查询分类开销】下拉
    const statCatSel = document.getElementById('stat-select-cat');
    statCatSel.innerHTML = `<option value="">请选择分类</option>`;
    data.categories.forEach(c=> statCatSel.innerHTML += `<option value="${c}">${c}</option>`);

    renderCategoryStat();
    renderBillList();
    renderBillStat();
    renderFixedBillList();
    renderChartArea();
}

//支出圆点颜色
function getExpenseDotClass(amount){
    if(amount>1000) return 'bg-black';
    if(amount>500) return 'bg-red-500';
    if(amount>100) return 'bg-orange-500';
    if(amount>50) return 'bg-purple-500';
    if(amount>20) return 'bg-yellow-500';
    return 'bg-green-500';
}
//文字颜色
function getAmountColor(amount){
    if(amount>1000) return 'text-black';
    if(amount>500) return 'text-red-600';
    if(amount>100) return 'text-orange-500';
    if(amount>50) return 'text-purple-600';
    if(amount>20) return 'text-yellow-600';
    return 'text-green-600';
}

//【新增】按月查询某分类开销
function queryMonthCategoryCost(){
    const month = document.getElementById("stat-month-cat").value;
    const cat = document.getElementById("stat-select-cat").value;
    const resBox = document.getElementById("month-cat-result");
    if(!month || !cat){
        resBox.innerHTML = "<div class='text-red-500'>请选择月份和分类</div>";
        return;
    }
    const list = data.bills.filter(b=> b.type==="expense" && b.category===cat && b.date.startsWith(month));
    let total = 0;
    let dayMap = {};
    list.forEach(b=>{
        total += b.amount;
        if(!dayMap[b.date]) dayMap[b.date]=0;
        dayMap[b.date] += b.amount;
    })
    let html = `<div class="font-semibold">${month}｜${cat}｜总支出：<span class="${getAmountColor(total)}">${total}</span></div>`;
    Object.keys(dayMap).sort().forEach(d=>{
        html += `<div class="flex justify-between"><span>${d}</span><span class="${getAmountColor(dayMap[d])}">${dayMap[d]}</span></div>`;
    })
    if(list.length===0) html += `<div class="text-gray-400 mt-1">该月该分类暂无消费记录</div>`;
    resBox.innerHTML = html;
}

function renderCategorySelectOptions(){
    const sel = document.getElementById("select-category-stat");
    sel.innerHTML = `<option value="">请选择分类</option>`;
    data.categories.forEach(c=> sel.innerHTML += `<option value="${c}">${c}</option>`);
}
function renderCategoryStat(){
    const sel = document.getElementById("select-category-stat");
    const targetCat = sel.value;
    const infoBox = document.getElementById("category-stat-info");
    if(!targetCat){
        infoBox.innerHTML = `<div class="text-gray-500">选择上方分类，查看该分类每日开销明细</div>`;
        return;
    }
    const catBills = data.bills.filter(b=>b.category === targetCat && b.type === "expense");
    let total = 0;
    const dayMap = {};
    catBills.forEach(b=>{
        total += b.amount;
        if(!dayMap[b.date]) dayMap[b.date] = 0;
        dayMap[b.date] += b.amount;
    })
    let dayHtml = "";
    Object.keys(dayMap).sort().forEach(d=>{
        const val = dayMap[d];
        dayHtml += `<div class="flex justify-between"><span>${d}</span><span class="${getAmountColor(val)}">${val}</span></div>`
    })
    infoBox.innerHTML = `
        <div class="mb-2">【${targetCat}】总支出：<span class="${getAmountColor(total)} font-bold">${total}</span></div>
        <div class="text-sm">每日明细：${catBills.length === 0 ? '<div>暂无记录</div>' : dayHtml}</div>
    `
}

//【彻底修复折线图】每次切换下拉，完全销毁旧实例，重新绘制
function renderChartArea(){
    const typeSel = document.getElementById("chart-type-select");
    const pieMonthInput = document.getElementById("chart-month-pie");
    const lineCatSel = document.getElementById("chart-category-line");
    const chartType = typeSel.value;
    //强制销毁
    if(pieChart){ pieChart.destroy(); pieChart=null; }
    if(lineChart){ lineChart.destroy(); lineChart=null; }

    if(chartType === "pie"){
        pieMonthInput.classList.remove("hidden");
        lineCatSel.classList.add("hidden");
        const month = pieMonthInput.value;
        if(!month) return;
        const monthBills = data.bills.filter(b=> b.type === "expense" && b.date.startsWith(month));
        const catSum = {};
        monthBills.forEach(b=>{
            if(!catSum[b.category]) catSum[b.category]=0;
            catSum[b.category] += b.amount;
        })
        const labels = Object.keys(catSum);
        const values = Object.values(catSum);
        const ctx = document.getElementById("chart-canvas").getContext("2d");
        pieChart = new Chart(ctx,{
            type:"pie",
            data:{ labels:labels, datasets:[{data:values}] },
            options:{responsive:true, maintainAspectRatio:false}
        })
    }else if(chartType === "line"){
        pieMonthInput.classList.add("hidden");
        lineCatSel.classList.remove("hidden");
        lineCatSel.innerHTML = "";
        data.categories.forEach(c=> lineCatSel.innerHTML += `<option value="${c}">${c}</option>`);
        lineCatSel.onchange = renderChartArea;
        const selectedCat = lineCatSel.value;
        const catBills = data.bills.filter(b=>b.type==="expense" && b.category === selectedCat);
        const monthSum = {};
        catBills.forEach(b=>{
            const m = b.date.substring(0,7);
            if(!monthSum[m]) monthSum[m]=0;
            monthSum[m] += b.amount;
        })
        const sortedMonths = Object.keys(monthSum).sort();
        const values = sortedMonths.map(m=>monthSum[m]);
        const ctx = document.getElementById("chart-canvas").getContext("2d");
        lineChart = new Chart(ctx,{
            type:"line",
            data:{
                labels:sortedMonths,
                datasets:[{ label:selectedCat+"月度消费", data:values, fill:false }]
            },
            options:{responsive:true, maintainAspectRatio:false}
        })
    }
}

//【修改查询打卡：支持删除该天的打卡记录】
function queryCheckinDate(){
    const targetDate = document.getElementById('query-checkin-date').value;
    const resultBox = document.getElementById('query-checkin-result');
    if(!targetDate){
        resultBox.innerHTML = "请选择日期";
        return;
    }
    let html = "";
    let hasRecord = false;
    data.checkins.forEach((ck,ckIdx)=>{
        //找出该项目下所有匹配日期的记录索引
        const matchIndexList = [];
        ck.records.forEach((r,recIdx)=>{
            if(r.startsWith(targetDate)) matchIndexList.push(recIdx);
        })
        if(matchIndexList.length>0){
            hasRecord=true;
            html += `<div class="flex justify-between items-center border-b py-1">
                <span>✅ ${ck.name}</span>
                <button class="text-red-500 text-xs" onclick="deleteOneDayCheckin(${ckIdx},${matchIndexList[0]})">删除这条打卡</button>
            </div>`;
        }
    })
    if(!hasRecord){
        html = `<div class="text-gray-500">${targetDate}：没有任何打卡记录</div>`;
    }
    resultBox.innerHTML = html;
}
//【新增删除某项目某一天单条打卡记录】
function deleteOneDayCheckin(checkinIndex,recordIndex){
    if(!confirm("确定删除该条打卡记录吗？")) return;
    data.checkins[checkinIndex].records.splice(recordIndex,1);
    saveData("checkins");
    queryCheckinDate();
    renderPage("checkin");
}

function renderCheckinList(){
    const wrap = document.getElementById('checkin-list');
    wrap.innerHTML = "";
    data.checkins.forEach((ck, idx)=>{
        const last = ck.records.length ? new Date(ck.records[ck.records.length-1]) : null;
        let streak = 0;
        if(last){
            const now = new Date();
            for(let i=0;i<ck.records.length;i++){
                const d = new Date(ck.records[ck.records.length-1-i]);
                if(Math.abs(d - now)/(1000*3600*24) <= i+1) streak++;
                else break;
            }
        }
        const dateList = ck.records.map(r=> r.split('T')[0]).join("、");
        wrap.innerHTML += `
        <div class="bg-white/70 p-3 rounded">
            <div class="flex justify-between items-center">
                <div class="font-semibold">${ck.name}</div>
                <div>连续打卡：${streak}天</div>
            </div>
            <div class="text-sm mt-1 text-gray-600">打卡日期：${dateList || "暂无打卡记录"}</div>
            <div class="flex gap-2 mt-2">
                <button onclick="doCheckin(${idx})" class="px-3 py-1 bg-primary text-white rounded text-sm">今日打卡</button>
                <button onclick="delCheckin(${idx})" class="px-3 py-1 bg-red-400 text-white rounded text-sm">删除项目</button>
            </div>
        </div>`
    })
}
function doCheckin(idx){
    const today = new Date().toISOString().split('T')[0];
    const exist = data.checkins[idx].records.find(r=> r.startsWith(today));
    if(exist) return alert('今天已经打卡！');
    data.checkins[idx].records.push(new Date().toISOString());
    saveData('checkins');
    renderPage('checkin');
}
function delCheckin(idx){ data.checkins.splice(idx,1); saveData('checkins'); renderPage('checkin'); }

//专注计时器
function startTimer(){
    if(timerInfo.running) return;
    const h = Number(document.getElementById('focus-h').value||0);
    const m = Number(document.getElementById('focus-m').value||0);
    const s = Number(document.getElementById('focus-s').value||0);
    timerInfo.total = h*3600 + m*60 + s;
    if(timerInfo.total <=0) return alert("设置时间");
    timerInfo.remain = timerInfo.remain || timerInfo.total;
    timerInfo.running = true;
    timerInfo.timerId = setInterval(tickTimer,1000);
}
function tickTimer(){
    timerInfo.remain--;
    updateTimerUI();
    if(timerInfo.remain <=0){
        pauseTimer();
        alert("专注时间结束！");
    }
}
function pauseTimer(){
    timerInfo.running = false;
    clearInterval(timerInfo.timerId);
}
function resetTimer(){
    pauseTimer();
    timerInfo.remain = 0;
    timerInfo.total =0;
    updateTimerUI();
}
function updateTimerUI(){
    const rem = timerInfo.remain;
    const h = Math.floor(rem/3600);
    const m = Math.floor((rem%3600)/60);
    const s = rem%60;
    const el = document.getElementById('timer-text');
    if(el){
        el.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    const progressEl = document.getElementById('timer-progress');
    if(progressEl){
        const percent = timerInfo.total ? rem / timerInfo.total : 0;
        const dashoffset = 283 * (1-percent);
        progressEl.style.strokeDashoffset = dashoffset;
    }
}

function saveData(key){
    localStorage.setItem(STORAGE_KEYS[key], JSON.stringify(data[key]));
}

if('serviceWorker' in navigator){
    navigator.serviceWorker.register('data:text/javascript,const CACHE_NAME="tool-v1";self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>e.respondWith(fetch(e.request).catch(r=>caches.match(e.request))))')
}
window.onload = function(){
    loadBg();
    renderPage("home");
}
